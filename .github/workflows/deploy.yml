# Publishes the site to MonsterASP.NET (https://s3sport.runasp.net) over FTPS on every push to main.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER     FTP server from the MonsterASP panel, e.g. site105494.siteasp.net
#   FTP_USER       main FTP login, e.g. site105494
#   FTP_PASSWORD   its password
#   DB_CONNECTION  SQL Server connection string of the hosted database
#
# Steps: build → write web.config from the secrets (no password in the repository) → put app_offline.htm so IIS
# releases the DLLs → upload only changed files → remove app_offline.htm (always, even after a failure) → check.
# Never touched on the server: App_Data (keys, vapid.json, logs) and wwwroot/uploads (crests, photos).
# Files are only deleted on the server if an earlier deploy uploaded them and they are gone from the build.
name: Deploy to MonsterASP

on:
  push:
    branches: [main]
    paths: ['S3Sport/**', 'global.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Check secrets
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          for n in FTP_SERVER FTP_USER FTP_PASSWORD DB_CONNECTION; do
            [ -n "${!n}" ] || { echo "::error::Secret $n is missing (Settings → Secrets and variables → Actions)."; exit 1; }
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish S3Sport/S3Sport.csproj -c Release -o publish

      - name: Write web.config from secrets
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          db=$(printf '%s' "$DB_CONNECTION" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g')
          cat > publish/web.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="dotnet" arguments=".\S3Sport.dll" stdoutLogEnabled="true" stdoutLogFile=".\App_Data\logs\stdout" hostingModel="inprocess">
                  <environmentVariables>
                    <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />
                    <environmentVariable name="ConnectionStrings__DefaultConnection" value="$db" />
                    <environmentVariable name="Database__AutoMigrate" value="true" />
                  </environmentVariables>
                </aspNetCore>
              </system.webServer>
            </location>
          </configuration>
          EOF
          # Server-side folders that must never be overwritten from the build.
          rm -rf publish/App_Data publish/wwwroot/uploads

      - name: Take the site offline
        run: |
          echo '<!doctype html><meta charset="utf-8"><title>S3Sport</title><p style="font-family:sans-serif;text-align:center;margin-top:20vh" dir="rtl">جاري تحديث الموقع… أعد المحاولة بعد دقيقة.</p>' > app_offline.htm
          curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" -T app_offline.htm "ftp://$FTP_SERVER/wwwroot/app_offline.htm"
          sleep 5

      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          server-dir: wwwroot/
          exclude: |
            **/App_Data/**
            **/wwwroot/uploads/**
            **/app_offline.htm

      - name: Bring the site back online
        if: always()
        run: curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" "ftp://$FTP_SERVER/" -Q "DELE wwwroot/app_offline.htm" -o /dev/null || true

      - name: Check the live site
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://s3sport.runasp.net/)
            [ "$code" = 200 ] && { echo "Site is up."; exit 0; }
            echo "status $code, waiting…"; sleep 10
          done
          echo "::error::Site did not answer 200 after the deploy."; exit 1
