<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0f1c" />
    <title>غير متصل | S3Sport</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: #0a0f1c; color: #e6eaf3; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; text-align: center; }
        .card { max-width: 420px; padding: 2rem 1.5rem; border: 1px solid #222c42; border-radius: 16px; background: #111827; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 1.3rem; margin: 1rem 0 .5rem; }
        p { color: #8b97ae; line-height: 1.7; }
        button { margin-top: .5rem; padding: .65rem 1.4rem; border: 0; border-radius: 10px; background: #1cc683; color: #04140d; font-weight: 700; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="S3Sport" />
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تحقق من اتصالك ثم أعد المحاولة. الصفحات التي زرتها سابقاً متاحة دون اتصال، والنتائج المباشرة تحتاج اتصالاً.</p>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
